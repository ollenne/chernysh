# Проверка нотаризации Mac-версии: если Apple думала дольше, чем ждала «Подпись Mac-версии»,
# этот процесс забирает сохранённый подписанный .dmg из того запуска, спрашивает Apple о результате
# и, если сборка принята, «прикрепляет» нотаризацию и кладёт .dmg в выпуск.
# Запуск: Actions → «Проверка нотаризации Mac» → Run workflow, указать номер запуска подписи (run id).

name: Проверка нотаризации Mac

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Номер запуска «Подпись Mac-версии» (run id из адреса страницы запуска)"
        required: true
      tag:
        description: "Выпуск (тег)"
        default: "v1.0"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  staple:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Забрать подписанный .dmg и номер отправки
        run: |
          gh run download "${{ inputs.run_id }}" --repo "$GITHUB_REPOSITORY" --name mac-dmg --dir keep
          SUB_ID="$(sed -n 1p keep/submission.txt)"
          DMG="$(sed -n 2p keep/submission.txt)"
          echo "SUB_ID=$SUB_ID" >> "$GITHUB_ENV"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          echo "Отправка: $SUB_ID, файл: $DMG"

      - name: Спросить Apple
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          printf '%s' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool info "$SUB_ID" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --output-format json > info.json
          cat info.json
          RESULT="$(python3 -c "import json;print(json.load(open('info.json')).get('status',''))")"
          echo "NOTARY=$RESULT" >> "$GITHUB_ENV"
          case "$RESULT" in
            Accepted) echo "Apple приняла сборку." ;;
            "In Progress") echo "::notice::Apple ещё проверяет. Запустите этот процесс ещё раз позже." ;;
            *) echo "Apple не приняла сборку ($RESULT). Подробности:"
               xcrun notarytool log "$SUB_ID" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER"
               rm -f "$RUNNER_TEMP/AuthKey.p8"; exit 1 ;;
          esac
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Прикрепить нотаризацию, проверить и положить в выпуск
        if: env.NOTARY == 'Accepted'
        run: |
          xcrun stapler staple "keep/$DMG"
          xcrun stapler validate "keep/$DMG"
          spctl -a -t open --context context:primary-signature -v "keep/$DMG"
          gh release upload "$TAG" "keep/$DMG" --repo "$GITHUB_REPOSITORY" --clobber
